name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oculus_user
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: oculus_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oculus_user -d oculus_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-not-used-anywhere-else-0123456789abcdef
      DATABASE_URL: postgresql+psycopg://oculus_user:ci-password@localhost:5432/oculus_ci
      TEST_DATABASE_URL: postgresql+psycopg://oculus_user:ci-password@localhost:5432/oculus_ci_test
      FLASK_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Unit and integration tests (in-memory SQLite)
        run: env -u TEST_DATABASE_URL pytest -q --cov=app --cov-report=term-missing

      - name: Create the throwaway test database
        run: PGPASSWORD=ci-password psql -h localhost -U oculus_user -d oculus_ci -c "CREATE DATABASE oculus_ci_test"

      - name: Same suite against PostgreSQL 16
        run: pytest -q

      - name: Migrations apply to an empty database
        run: flask --app run db upgrade

      - name: Models and migrations have not drifted apart
        run: flask --app run db check

      - name: Demo data seeds through the real detection pipeline
        run: flask --app run seed

      - name: Postman collection is up to date with the OpenAPI spec
        run: |
          python scripts/make_postman.py
          git diff --exit-code docs/postman
